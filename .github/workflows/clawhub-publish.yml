name: Publish to ClawHub

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing npm and GitHub release tag to publish
        required: true
        type: string
      dry_run:
        description: Validate the ClawHub package without publishing
        required: true
        default: true
        type: boolean

jobs:
  pull-request-package:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build package tarball
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/clawhub-pr-package"
          npm pack --pack-destination "$RUNNER_TEMP/clawhub-pr-package"

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/clawhub-pr-package"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one package tarball, found ${#tarballs[@]}"
            exit 1
          fi
          tar -tzf "${tarballs[0]}" | grep -Fx 'package/dist/index.js'

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: clawhub-pr-package
          path: ${{ runner.temp }}/clawhub-pr-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  dry-run:
    needs: pull-request-package
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      id-token: write
    # openclaw/clawhub package-publish.yml v0.23.1
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      package_artifact_name: clawhub-pr-package
      dry_run: true

  release-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify npm release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_tag="v$version"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Select release tag $expected_tag, not $RELEASE_TAG"
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$GITHUB_SHA" ]; then
            echo "Dispatch this workflow from $RELEASE_TAG, not $GITHUB_REF"
            exit 1
          fi

          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$source_sha" != "$tag_sha" ]; then
            echo "Checked out $source_sha, expected $RELEASE_TAG at $tag_sha"
            exit 1
          fi

          npm_state="$(npm view "$package_name@$version" version gitHead --json)"
          published_version="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.version || "")' "$npm_state")"
          published_sha="$(node -e 'const data=JSON.parse(process.argv[1]); process.stdout.write(data.gitHead || "")' "$npm_state")"

          if [ "$published_version" != "$version" ] || [ "$published_sha" != "$source_sha" ]; then
            echo "npm identity does not match $expected_tag at $source_sha"
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download exact npm package tarball
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/clawhub-release-package"
          npm pack "$package_name@$version" --pack-destination "$RUNNER_TEMP/clawhub-release-package"

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/clawhub-release-package"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one package tarball, found ${#tarballs[@]}"
            exit 1
          fi
          tar -tzf "${tarballs[0]}" | grep -Fx 'package/dist/index.js'

      - name: Upload exact npm package tarball
        uses: actions/upload-artifact@v4
        with:
          name: clawhub-release-package
          path: ${{ runner.temp }}/clawhub-release-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  release-dry-run:
    needs: release-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    permissions:
      actions: read
      contents: read
      id-token: write
    # openclaw/clawhub package-publish.yml v0.23.1
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      source: ${{ github.repository }}
      ref: ${{ needs.release-preflight.outputs.source_sha }}
      source_ref: refs/tags/${{ inputs.release_tag }}
      package_artifact_name: clawhub-release-package
      dry_run: true

  publish:
    needs: release-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    concurrency:
      group: clawhub-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    # openclaw/clawhub package-publish.yml v0.23.1
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      source: ${{ github.repository }}
      ref: ${{ needs.release-preflight.outputs.source_sha }}
      source_ref: refs/tags/${{ inputs.release_tag }}
      package_artifact_name: clawhub-release-package
      dry_run: false
